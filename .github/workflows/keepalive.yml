name: Keep Supabase awake
# Free Supabase projects pause after ~1 week with no activity. This pings the database every 3 days.
# On the 1st of every month it also makes one tiny commit, so GitHub never treats the repo as inactive
# (GitHub switches off scheduled jobs after 60 days without repo activity).
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://sltzidgkspdeehhhjrts.supabase.co/rest/v1/rpc/public_bootstrap" \
            -H "apikey: sb_publishable_dufK2bbg-yfST5eHhB5WdQ_uz90MoBD" -H "Authorization: Bearer sb_publishable_dufK2bbg-yfST5eHhB5WdQ_uz90MoBD" -H "Content-Type: application/json" -d '{}')
          echo "Supabase answered: $code"
          test "$code" = "200"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Monthly activity commit
        run: |
          if [ "$(date -u +%d)" = "01" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            date -u +"last keep-alive: %Y-%m-%d" > .github/keepalive-last.txt
            git config user.name "keepalive-bot"
            git config user.email "keepalive-bot@users.noreply.github.com"
            git add .github/keepalive-last.txt
            git commit -m "keep-alive: monthly activity" || echo "nothing to commit"
            git push || echo "push skipped"
          fi
