name: Keep Supabase awake
# Free Supabase projects pause after ~1 week with no activity. This pings the database every 3 days.
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://sltzidgkspdeehhhjrts.supabase.co/rest/v1/rpc/public_bootstrap" \
            -H "apikey: sb_publishable_dufK2bbg-yfST5eHhB5WdQ_uz90MoBD" -H "Authorization: Bearer sb_publishable_dufK2bbg-yfST5eHhB5WdQ_uz90MoBD" -H "Content-Type: application/json" -d '{}')
          echo "Supabase answered: $code"
          test "$code" = "200"
